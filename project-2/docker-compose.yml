name: dmp-local

# Local data pipeline:
#   api -> postgres (orders) + redpanda (events) -> lander -> minio raw/
#   etl     (profile: jobs) raw/ + orders -> curated/
#   segment (profile: jobs) curated/ -> activation/

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: pipeline
    ports: ["5432:5432"]
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 2s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      retries: 30

  minio:
    build:
      context: docker
      dockerfile: minio.Dockerfile
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live"]
      interval: 2s
      retries: 30

  api:
    build: services
    command: ["/app/api"]
    environment:
      DATABASE_URL: postgres://pipeline:pipeline@postgres:5432/pipeline
      KAFKA_BROKERS: redpanda:9092
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}

  lander:
    build: services
    command: ["/app/lander"]
    environment:
      <<: *s3-env
      KAFKA_BROKERS: redpanda:9092
      S3_BUCKET: data-lake
      FLUSH_INTERVAL: ${FLUSH_INTERVAL:-30s}
    depends_on:
      redpanda: {condition: service_healthy}
      minio: {condition: service_healthy}

  etl:
    build: etl
    profiles: ["jobs"]
    environment:
      <<: *s3-env
      LAKE_ROOT: s3a://data-lake
      JDBC_URL: jdbc:postgresql://postgres:5432/pipeline
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}

  segment:
    build: query
    profiles: ["jobs"]
    environment:
      <<: *s3-env
      LAKE_ROOT: s3://data-lake
      MIN_SPEND: ${MIN_SPEND:-10000}
      WINDOW_DAYS: ${WINDOW_DAYS:-30}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    depends_on:
      minio: {condition: service_healthy}

volumes:
  postgres-data:
  redpanda-data:
  minio-data:
